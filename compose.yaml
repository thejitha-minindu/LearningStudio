services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: learning
      POSTGRES_USER: learning
      POSTGRES_PASSWORD: learning
    volumes:
      - learning_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning -d learning"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      DEV_API_TOKEN: ${DEV_API_TOKEN:-local-development-only}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  learning_data:
